# yamllint disable rule:line-length
# yamllint disable rule:truthy
---

name: test

on:
  push:

jobs:
  default:
    runs-on: docker
    container:
      image: lv2plugin/debian-gcc
    steps:
      - name: 'Clone'
        run: >
          git clone --branch $FORGEJO_REF_NAME --depth 1
          $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git .
      - name: 'Setup'
        run: meson setup build -Dwerror=true
      - name: 'Build'
        run: ninja -C build
      - name: 'Test'
        run: ninja -C build test

  dev:
    runs-on: docker
    container:
      image: drobilla/debian-gcc-dev:20260710
    steps:
      - name: 'Clone'
        run: >
          git clone --branch $FORGEJO_REF_NAME --depth 1
          $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git .
      - name: 'Setup (debug)'
        run: meson setup build -Dbuildtype=debug -Dwarning_level=everything -Dwerror=true
      - name: 'Build (debug)'
        run: ninja -C build
      - name: 'Test (debug)'
        run: ninja -C build test
      - name: 'Configure (release)'
        run: meson configure build -Dbuildtype=release
      - name: 'Build (release)'
        run: ninja -C build
      - name: 'Test (release)'
        run: ninja -C build test

  cpp:
    runs-on: docker
    container:
      image: drobilla/debian-gcc:20260710
    steps:
      - name: 'Clone'
        run: >
          git clone --branch $FORGEJO_REF_NAME --depth 1
          $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git .
      - name: 'Build'
        run: |
          mkdir -p build
          g++ -Iinclude -Wall -Werror -Wextra -Wpedantic -rdynamic -shared -std=c++17 -o build/librerex.so src/*.c

  sanitize:
    runs-on: docker
    container:
      image: drobilla/debian-clang:20260710
    steps:
      - name: 'Clone'
        run: >
          git clone --branch $FORGEJO_REF_NAME --depth 1
          $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git .
      - name: 'Setup (address/etc)'
        run: meson setup build -Db_lundef=false -Dbuildtype=plain -Dc_args="-fno-sanitize-recover=all -fsanitize=address -fsanitize=undefined -fsanitize=float-divide-by-zero -fsanitize=unsigned-integer-overflow -fsanitize=implicit-conversion -fsanitize=local-bounds -fsanitize=nullability" -Dc_link_args="-fno-sanitize-recover=all -fsanitize=address -fsanitize=undefined -fsanitize=float-divide-by-zero -fsanitize=unsigned-integer-overflow -fsanitize=implicit-conversion -fsanitize=local-bounds -fsanitize=nullability" -Dwarning_level=3 -Dwerror=true
      - name: 'Build (address/etc)'
        run: ninja -C build
      - name: 'Test (address/etc)'
        run: ninja -C build test
      - name: 'Configure (memory)'
        run: meson configure build -Db_sanitize=memory -Dbuildtype=debugoptimized -Dc_args="" -Dc_link_args=""
      - name: 'Build (memory)'
        run: ninja -C build
      - name: 'Test (memory)'
        run: ninja -C build test

  fedora:
    runs-on: docker
    container:
      image: drobilla/fedora-dev:20260710
    steps:
      - name: 'Clone'
        run: >
          git clone --branch $FORGEJO_REF_NAME --depth 1
          $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git .
      - name: 'Setup (debug)'
        run: meson setup build -Dbuildtype=plain -Dc_args="-O2 -D_FORTIFY_SOURCE=2" -Dwarning_level=everything -Dwerror=true
      - name: 'Build (debug)'
        run: ninja -C build
      - name: 'Test (debug)'
        run: ninja -C build test
      - name: 'Configure (release)'
        run: meson configure build -Dbuildtype=release
      - name: 'Build (release)'
        run: ninja -C build
      - name: 'Test (release)'
        run: ninja -C build test

  armhf:
    runs-on: docker
    container:
      image: drobilla/debian-gcc-armhf:20260710
    steps:
      - name: 'Clone'
        run: >
          git clone --branch $FORGEJO_REF_NAME --depth 1
          $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git .
      - name: 'Setup (debug)'
        run: meson setup build --cross-file=/usr/share/meson/cross/arm-linux-gnueabihf.ini -Dbuildtype=debug -Dc_std=c11 -Dwarning_level=everything -Dwerror=true
      - name: 'Build (debug)'
        run: ninja -C build
      - name: 'Test (debug)'
        run: ninja -C build test
      - name: 'Configure (release)'
        run: meson configure build -Dbuildtype=release
      - name: 'Build (release)'
        run: ninja -C build
      - name: 'Test (release)'
        run: ninja -C build test

  arm64:
    runs-on: docker
    container:
      image: drobilla/debian-gcc-arm64:20260710
    steps:
      - name: 'Clone'
        run: >
          git clone --branch $FORGEJO_REF_NAME --depth 1
          $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git .
      - name: 'Setup (debug)'
        run: meson setup build --cross-file=/usr/share/meson/cross/aarch64-linux-gnu.ini -Dbuildtype=debug -Dc_std=c11 -Dwarning_level=everything -Dwerror=true
      - name: 'Build (debug)'
        run: ninja -C build
      - name: 'Test (debug)'
        run: ninja -C build test
      - name: 'Configure (release)'
        run: meson configure build -Dbuildtype=release
      - name: 'Build (release)'
        run: ninja -C build
      - name: 'Test (release)'
        run: ninja -C build test

  i386:
    runs-on: docker
    container:
      image: drobilla/debian-gcc-i386:20260710
    steps:
      - name: 'Clone'
        run: >
          git clone --branch $FORGEJO_REF_NAME --depth 1
          $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git .
      - name: 'Setup (debug)'
        run: meson setup build --cross-file=/usr/share/meson/cross/i686-linux-gnu.ini -Dbuildtype=debug -Dwarning_level=everything -Dwerror=true
      - name: 'Build (debug)'
        run: ninja -C build
      - name: 'Test (debug)'
        run: ninja -C build test
      - name: 'Configure (release)'
        run: meson configure build -Dbuildtype=release
      - name: 'Build (release)'
        run: ninja -C build
      - name: 'Test (release)'
        run: ninja -C build test

  mingw32:
    runs-on: docker
    container:
      image: drobilla/debian-mingw32:20260710
    env:
      WINEPATH: "Z:\\usr\\lib\\gcc\\i686-w64-mingw32\\12-win32"
    steps:
      - name: 'Clone'
        run: >
          git clone --branch $FORGEJO_REF_NAME --depth 1
          $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git .
      - name: 'Setup (debug)'
        run: meson setup build --cross-file=/usr/share/meson/cross/i686-w64-mingw32.ini -Dbuildtype=debug -Dwarning_level=everything -Dwerror=true
      - name: 'Build (debug)'
        run: ninja -C build
      - name: 'Test (debug)'
        run: meson test -C build -t 2
      - name: 'Configure (release)'
        run: meson configure build -Dbuildtype=release
      - name: 'Build (release)'
        run: ninja -C build
      - name: 'Test (release)'
        run: ninja -C build test

  mingw64:
    runs-on: docker
    container:
      image: drobilla/debian-mingw64:20260710
    env:
      WINEPATH: "Z:\\usr\\lib\\gcc\\x86_64-w64-mingw32\\12-win32"
    steps:
      - name: 'Clone'
        run: >
          git clone --branch $FORGEJO_REF_NAME --depth 1
          $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git .
      - name: 'Setup (debug)'
        run: meson setup build --cross-file=/usr/share/meson/cross/x86_64-w64-mingw32.ini -Dbuildtype=debug -Dwarning_level=everything -Dwerror=true
      - name: 'Build (debug)'
        run: ninja -C build
      - name: 'Test (debug)'
        run: meson test -C build -t 2
      - name: 'Configure (release)'
        run: meson configure build -Dbuildtype=release
      - name: 'Build (release)'
        run: ninja -C build
      - name: 'Test (release)'
        run: ninja -C build test

  wasm:
    runs-on: docker
    container:
      image: drobilla/debian-wasm:20260710
    steps:
      - name: 'Clone'
        run: >
          git clone --branch $FORGEJO_REF_NAME --depth 1
          $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git .
      - name: 'Setup (debug)'
        run: meson setup build --cross-file=/usr/share/meson/cross/wasm.ini -Dbuildtype=debug -Ddefault_library=static -Dwarning_level=everything -Dwerror=true
      - name: 'Build (debug)'
        run: ninja -C build
      - name: 'Test (debug)'
        run: meson test -C build -t 2
      - name: 'Configure (release)'
        run: meson configure build -Dbuildtype=release
      - name: 'Build (release)'
        run: ninja -C build
      - name: 'Test (release)'
        run: ninja -C build test

  freebsd:
    runs-on: [freebsd, meson, ninja]
    steps:
      - name: 'Clone'
        run: >
          git clone --branch $FORGEJO_REF_NAME --depth 1
          $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git .
      - name: 'Setup (debug)'
        run: meson setup build -Dbuildtype=debug -Dwarning_level=everything -Dwerror=true
      - name: 'Build (debug)'
        run: ninja -C build
      - name: 'Test (debug)'
        run: ninja -C build test
      - name: 'Configure (release)'
        run: meson configure build -Dbuildtype=release
      - name: 'Build (release)'
        run: ninja -C build
      - name: 'Test (release)'
        run: ninja -C build test

  mac:
    runs-on: [macos-arm64, meson, ninja]
    steps:
      - name: 'Clone'
        run: >
          git clone --branch $FORGEJO_REF_NAME --depth 1
          $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git .
      - name: 'Setup (debug)'
        run: meson setup build -Dbuildtype=debug -Dwarning_level=everything -Dwerror=true
      - name: 'Build (debug)'
        run: ninja -C build
      - name: 'Test (debug)'
        run: ninja -C build test
      - name: 'Configure (release)'
        run: meson configure build -Dbuildtype=release
      - name: 'Build (release)'
        run: ninja -C build
      - name: 'Test (release)'
        run: ninja -C build test

  win:
    runs-on: [windows, meson, ninja, msvc]
    steps:
      - name: 'Clone'
        run: >
          git clone --branch ${Env:FORGEJO_REF_NAME} --depth 1
          ${Env:FORGEJO_SERVER_URL}/${Env:FORGEJO_REPOSITORY}.git .
      - name: 'Setup (debug)'
        run: meson setup build -Dbuildtype=debug -Dwarning_level=everything -Dwerror=true
      - name: 'Build (debug)'
        run: ninja -C build
      - name: 'Test (debug)'
        run: ninja -C build test
      - name: 'Configure (release)'
        run: meson configure build -Dbuildtype=release
      - name: 'Build (release)'
        run: ninja -C build
      - name: 'Test (release)'
        run: ninja -C build test
